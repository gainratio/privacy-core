# Monthly, grouped dependency updates (ENGINEERING-STANDARDS §4), with a 7-day
# cooldown. Minor + patch arrive as one PR per ecosystem. Semver-major updates
# are ignored: majors are migrated by hand in their own PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Majors are migrated by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Majors are migrated by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev-toolchain:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
