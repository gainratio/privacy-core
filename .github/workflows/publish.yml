name: Publish (npm, OIDC)

# npm trusted publishing is bound to this workflow FILENAME (publish.yml).
# Renaming it silently breaks every future release.

on:
  workflow_run:
    workflows: [Dagger release candidate]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact Dagger candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # `head_branch == default_branch` above is satisfied by a dispatch on a
      # TAG named `main`, so it cannot bind the candidate to main on its own.
      # Before any artifact is touched, the central hseshadr/ci lineage function
      # (pinned at a literal commit, hseshadr/ci#49) proves from GitHub's run
      # records that the triggering run is a successful dispatch of
      # release-candidate.yml here for exactly HEAD_SHA, and that main contains
      # HEAD_SHA. Only then does it write github-context.json: the GitHub
      # Actions context npm needs for provenance (and for the OIDC exchange),
      # derived from this publish run's own record, outside the release/
      # candidate. Event values reach the action's bash only as quoted env vars.
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/ci/modules/portfolio-foundation@3de1c4bef2558fd6610b6dda1504b657de7a954d
          args: release-provenance --github-token=env:GH_TOKEN --repository="$GITHUB_REPOSITORY" --run-id="$RUN_ID" --head-sha="$HEAD_SHA" --publish-run-id="$GITHUB_RUN_ID" export --path=github-context.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: privacy-core-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      # The publisher CODE is loaded from github.sha — the default-branch commit
      # this workflow runs on — never from the candidate's own sha. It validates
      # every provenance value before npm sees it.
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/privacy-core@${{ github.sha }}
          args: publish --candidate=release --expected-sha="$HEAD_SHA" --oidc-url=env:ACTIONS_ID_TOKEN_REQUEST_URL --oidc-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN --github-context=github-context.json
