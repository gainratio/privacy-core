packages:
  - "."
  - "examples/*"

# Supply-chain cooldown: refuse any dependency version published less than 24h
# ago — the window in which a compromised release is usually caught and pulled.
# pnpm 11.5.0 already defaults to this, but a default is not a policy, so it is
# stated here and held by test/registry-maturity.test.ts. Never add a
# `minimumReleaseAgeExclude:` list or `minimumReleaseAgeStrict: false`; when the
# cooldown refuses a fresh release, wait the window out.
minimumReleaseAge: 1440

allowBuilds:
  "@biomejs/biome": true
  esbuild: true

# Force the transitive dev-only postcss (pulled in via vitest -> vite) to the
# patched line for GHSA-r28c-9q8g-f849 (path traversal in source-map auto-load,
# fixed in >=8.5.18). Not shipped in dist; dev/build tooling only.
# Pin the same transitive toolchain's nanoid to the patched 3.x line for
# GHSA-2v37-7h3g-55p8. The `<4` ceiling avoids an unreviewed major jump.
overrides:
  postcss: ">=8.5.18"
  nanoid: ">=3.3.17 <4"
  vite: ">=8.3.3"
